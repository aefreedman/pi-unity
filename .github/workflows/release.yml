name: npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag at main to publish or reconcile
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run
      - name: Reconcile npm release identity
        shell: bash
        run: |
          node .github/scripts/reconcile-npm-release.mjs
      - name: Publish to npm with trusted publishing
        if: env.SKIP_NPM_PUBLISH != 'true'
        run: npm publish --access public --provenance
